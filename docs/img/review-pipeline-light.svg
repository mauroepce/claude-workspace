<text x="48" y="34" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="15"><tspan fill="#8A6A1E">$</tspan><tspan fill="#1F1F24" dx="9">git commit</tspan></text>
<text x="196" y="34" font-family="Iowan Old Style, Palatino, Georgia, Times New Roman, serif" font-size="13" fill="#7A6428" font-style="italic">three actors, and only one of them holds the pen</text>
<text x="832" y="34" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="10.5" fill="#5E5E68" text-anchor="end">a prompt is a request  ·  a hook is a wall</text>
