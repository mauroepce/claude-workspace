<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="rp-title rp-desc">
<title id="rp-title">The commit pipeline</title>
<desc id="rp-desc">Three actors with different powers. /work is the author and holds the pen. code-reviewer is a separate subagent with a clean context and no write tools. commit-gate.sh is a PreToolUse hook: code, not a prompt. The reviewer writes a receipt containing a hash of the exact staged diff; the gate recomputes that hash at commit time. A matching hash passes through the gate and the commit lands. If anything was staged after the review the hash no longer matches and the commit is blocked.</desc>
